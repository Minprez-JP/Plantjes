name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Audit, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-name: ${{ steps.artifact-name.outputs.name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      # `npm ci` installs exactly the committed lockfile, so the dependency
      # graph in the PR is what gets audited and built.
      - name: Install dependencies
        run: npm ci

      - name: Verify install integrity
        run: |
          git diff --exit-code -- package-lock.json
          npm run verify:install

      # The app ships no development dependencies, so the blocking gate audits
      # only the runtime graph. Dev-only advisories are checked by the audit
      # policy in security reports and need a reviewed acceptance to pass.
      - name: Audit runtime dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Report dev-only advisories
        run: npm audit --audit-level=high || true

      # Generates audit/SARIF evidence, CycloneDX SBOMs, licence inventory and
      # third-party notices from the installed dependency tree.
      - name: Generate security reports
        run: npm run security:reports

      - name: Test
        run: npm test
        env:
          # The dedicated browser-egress job runs this suite against a preview
          # server, so the shared gate stays deterministic on runners without
          # a browser.
          SKIP_BROWSER_EGRESS: '1'

      - name: Build
        run: npm run build

      - name: Verify no remote egress
        run: npm run verify:no-egress

      - name: Set artifact name
        id: artifact-name
        run: |
          branch="${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"
          echo "name=security-reports-${branch}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload security reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: artifacts/security/
          retention-days: 90
          if-no-files-found: error

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan commits for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  browser-egress:
    name: Browser no-egress
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect browser
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          for candidate in google-chrome google-chrome-stable chromium chromium-browser microsoft-edge; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "path=$(command -v "$candidate")" >> "$GITHUB_OUTPUT"
              echo "available=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "available=false" >> "$GITHUB_OUTPUT"

      - name: Run browser egress regression
        if: steps.browser.outputs.available == 'true'
        env:
          CHROME_PATH: ${{ steps.browser.outputs.path }}
        run: npm test -- scripts/security/browser-no-egress.test.mjs

      - name: Fail when browser is unavailable
        if: steps.browser.outputs.available != 'true'
        run: |
          echo "::error::No Chrome/Chromium/Edge binary found on the runner."
          exit 1

  zap-baseline:
    name: ZAP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ZAP_TARGET: http://127.0.0.1:4173
      # Resolved from ghcr.io/zaproxy/zaproxy:stable on 2026-11-23.
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build preview bundle
        run: npm run build

      - name: Create report directory
        run: |
          mkdir -p artifacts/zap
          chmod 777 artifacts/zap

      - name: Start local preview
        shell: bash
        run: |
          set -euo pipefail
          nohup ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          echo $! > preview.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$ZAP_TARGET/" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat preview.log
          echo "::error::vite preview did not become ready at $ZAP_TARGET"
          exit 1

      # -I keeps ZAP's generic WARN exit code from masking the explicit
      # high-risk gate; -silent disables add-on updates and telemetry so the
      # container only talks to the local preview origin.
      - name: Run ZAP baseline
        shell: bash
        run: |
          docker run --rm --network host \
            -v "$PWD/artifacts/zap:/zap/wrk:rw" \
            "$ZAP_IMAGE" \
            zap-baseline.py \
            -t "$ZAP_TARGET" \
            -m 1 -T 3 -D 5 -I -s \
            -J zap-report.json \
            -r zap-report.html \
            -z "-silent -notel -config api.disablekey=true -config database.recoverylog=false"

      - name: Gate high-risk alerts
        env:
          ZAP_TARGET_ORIGIN: ${{ env.ZAP_TARGET }}
        run: node scripts/security/check-zap-report.mjs artifacts/zap/zap-report.json security-policies/zap-risk-acceptance.json

      - name: Set artifact name
        id: artifact-name
        run: |
          branch="${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"
          echo "name=zap-baseline-${branch}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: artifacts/zap/
          retention-days: 90
          if-no-files-found: error

      - name: Stop local preview
        if: always()
        shell: bash
        run: |
          if [ -f preview.pid ]; then
            kill "$(cat preview.pid)" 2>/dev/null || true
          fi

  upload-security-sarif:
    name: Upload security lint SARIF
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Download security reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.verify.outputs.artifact-name }}
          path: artifacts/security

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: artifacts/security/security-lint.sarif
          category: security-lint
