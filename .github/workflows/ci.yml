name: CI

on:
  push:
  pull_request:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Audit, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      # `npm ci` installs exactly the committed lockfile, so a reviewed
      # dependency graph is what gets audited and built.
      - name: Install dependencies
        run: npm ci

      # The app ships no development dependencies, so the blocking gate audits
      # only the runtime graph. Dev-only advisories (for example the unpatched
      # picomatch ReDoS GHSA-fc5q-39xc-vjpf) are reported without blocking.
      - name: Audit runtime dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Report dev-only advisories
        run: npm audit --audit-level=high || true

      # This also runs the pinned security lint rules and fails on any finding.
      - name: Generate security reports
        run: npm run security:reports

      - name: Upload security reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports
          path: artifacts/security/
          retention-days: 90
          if-no-files-found: error

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  upload-security-sarif:
    name: Upload security lint SARIF
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Download security reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security-reports
          path: artifacts/security

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: artifacts/security/security-lint.sarif
          category: security-lint
